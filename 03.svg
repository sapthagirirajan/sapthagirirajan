<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">

<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#05163a"/><stop offset="1" stop-color="#120626"/>
 </linearGradient>
 <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#00f2fe"/><stop offset=".5" stop-color="#4facfe"/><stop offset="1" stop-color="#b16cff"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00f2fe"/><stop offset=".5" stop-color="#4facfe" stop-opacity=".3"/><stop offset="1" stop-color="#b16cff"/>
 </linearGradient>
 <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#00f2fe" stop-opacity="0"/><stop offset="1" stop-color="#00f2fe" stop-opacity=".18"/>
 </linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#00f2fe" stroke-opacity=".07"/>
 </pattern>
</defs>
<style>
.edge{stroke:#00f2fe;stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 10;animation:flow 3.5s linear infinite}
.node{fill:#00f2fe;filter:url(#glow);animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-140}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(360px)}}
.fade{animation:fade 4s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<clipPath id="clip"><rect width="600" height="220" rx="18"/></clipPath>
<g clip-path="url(#clip)">
<rect width="600" height="220" fill="url(#bg)"/><rect width="600" height="220" fill="url(#grid)"/>
<circle cx="560" cy="30" r="120" fill="#b16cff" fill-opacity=".06"/>
<rect class="scan" x="0" y="0" width="600" height="30" fill="url(#scanG)"/>
</g>
<rect x="1" y="1" width="598" height="218" rx="18" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="32" y="48" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#b16cff" letter-spacing="2">03 //</text>
<circle cx="548" cy="43" r="5" fill="#22c55e" class="fade"/><text x="536" y="48" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" fill="#64748b">ACTIVE</text>
<text x="32" y="88" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#f1f5f9">RAG KNOWLEDGE ASSISTANT</text>
<text x="32" y="122" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Chat with your documents using retrieval-</text>
<text x="32" y="144" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">augmented generation &amp; vector search.</text>
<rect x="32" y="168" width="80" height="28" rx="14" fill="#b16cff" fill-opacity=".12" stroke="#b16cff" stroke-opacity=".6"/><text x="72.0" y="187" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#b16cff">Python</text><rect x="122" y="168" width="89" height="28" rx="14" fill="#b16cff" fill-opacity=".12" stroke="#b16cff" stroke-opacity=".6"/><text x="166.5" y="187" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#b16cff">FastAPI</text><rect x="221" y="168" width="62" height="28" rx="14" fill="#b16cff" fill-opacity=".12" stroke="#b16cff" stroke-opacity=".6"/><text x="252.0" y="187" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#b16cff">LLMs</text><rect x="293" y="168" width="107" height="28" rx="14" fill="#b16cff" fill-opacity=".12" stroke="#b16cff" stroke-opacity=".6"/><text x="346.5" y="187" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#b16cff">Vector DB</text>
<text x="568" y="190" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#b16cff">view repo →</text>
</svg>