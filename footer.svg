<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">

<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#05163a"/><stop offset="1" stop-color="#120626"/>
 </linearGradient>
 <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#00f2fe"/><stop offset=".5" stop-color="#4facfe"/><stop offset="1" stop-color="#b16cff"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00f2fe"/><stop offset=".5" stop-color="#4facfe" stop-opacity=".3"/><stop offset="1" stop-color="#b16cff"/>
 </linearGradient>
 <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#00f2fe" stop-opacity="0"/><stop offset="1" stop-color="#00f2fe" stop-opacity=".18"/>
 </linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#00f2fe" stroke-opacity=".07"/>
 </pattern>
</defs>
<style>
.edge{stroke:#00f2fe;stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 10;animation:flow 3.5s linear infinite}
.node{fill:#00f2fe;filter:url(#glow);animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-140}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(360px)}}
.fade{animation:fade 4s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<clipPath id="clip"><rect width="1200" height="180" rx="22"/></clipPath>
<g clip-path="url(#clip)">
<rect width="1200" height="180" fill="url(#bg)"/><rect width="1200" height="180" fill="url(#grid)"/>
<circle class="node" cx="40" cy="50" r="3" style="animation-delay:-1.7s"/>
<circle class="node" cx="100" cy="40" r="3" style="animation-delay:-1.0s"/>
<circle class="node" cx="160" cy="40" r="3" style="animation-delay:-1.8s"/>
<circle class="node" cx="220" cy="50" r="3" style="animation-delay:-2.4s"/>
<circle class="node" cx="280" cy="30" r="3" style="animation-delay:-2.5s"/>
<circle class="node" cx="340" cy="40" r="3" style="animation-delay:-1.4s"/>
<circle class="node" cx="400" cy="50" r="3" style="animation-delay:-0.2s"/>
<circle class="node" cx="460" cy="50" r="3" style="animation-delay:-2.1s"/>
<circle class="node" cx="520" cy="50" r="3" style="animation-delay:-1.7s"/>
<circle class="node" cx="580" cy="50" r="3" style="animation-delay:-2.5s"/>
<circle class="node" cx="640" cy="40" r="3" style="animation-delay:-2.1s"/>
<circle class="node" cx="700" cy="50" r="3" style="animation-delay:-1.0s"/>
<circle class="node" cx="760" cy="40" r="3" style="animation-delay:-1.1s"/>
<circle class="node" cx="820" cy="50" r="3" style="animation-delay:-0.4s"/>
<circle class="node" cx="880" cy="30" r="3" style="animation-delay:-0.7s"/>
<circle class="node" cx="940" cy="40" r="3" style="animation-delay:-0.4s"/>
<circle class="node" cx="1000" cy="30" r="3" style="animation-delay:-1.2s"/>
<circle class="node" cx="1060" cy="40" r="3" style="animation-delay:-0.2s"/>
<circle class="node" cx="1120" cy="40" r="3" style="animation-delay:-1.2s"/>
<circle class="node" cx="1180" cy="40" r="3" style="animation-delay:-2.7s"/>
</g>
<rect x="1" y="1" width="1198" height="178" rx="22" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="600" y="88" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-style="italic" fill="#e2e8f0">“Innovation lies at the intersection of code, intelligence, and creativity.”</text>
<text x="600" y="132" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17" fill="url(#txt)" filter="url(#glow)">while (alive) { learn(); build(); ship(); repeat(); }</text>
<text class="fade" x="600" y="160" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#64748b" letter-spacing="3">— END OF TRANSMISSION —</text>
</svg>